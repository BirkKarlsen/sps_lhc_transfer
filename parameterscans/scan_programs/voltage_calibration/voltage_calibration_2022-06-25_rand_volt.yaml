# First scan with RF noise to look at out-of-bucket loss as a function of bunch length
# Bunch generation configuration
generated_in: 'SPS'
include_impedance: 1
broadband: 1
f_cutoff: 5e9
z_over_n: 0.082
# Beam parameters
intensity:              # Operational LHC intensity during 2023
  mean: 0.0530
  std: 0.0073
  n_samples: 1000
n_macroparticles: 20000000
slice_exponent: 8
exponent: 1.5
bunchlength:
  mean: 0.561                # [ns]
  std: 0.089                 # [ns]
  n_samples: 1000
# Tracking configuration
number_of_turns: 10000     # Number of turns corresponding to 5 minutes
diag_setting: 1
dt_cont: 2
dt_beam: 1000
dt_cl: 1000
dt_prfl: 2000
dt_ld: 10001
dt_int: 1
# SPS settings
voltage_200: 4.91
voltage_800: 0.10
# LHC settings
energy_error:
  mean: 11.4
  std: 8.9
  n_samples: 1000
phase_error:
  mean: -29.0
  std: 9.1
  n_samples: 1000
include_global: 0           # Including beam-phase loop
voltage:
  mean: 1.5
  std: 0.15
  n_samples: 1000
# HT condor settings
flavour: 'longlunch'
run_gpu: 1
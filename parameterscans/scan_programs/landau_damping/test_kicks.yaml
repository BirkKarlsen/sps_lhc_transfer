# Single simulation of IBS for a standard bunch beam with average parameters
# Bunch generation configuration
generated_in: 'LHC'
intra_beam: 0
# Bunch generation inputs
intensity: 1.8
n_macroparticles: 50_000_000
slice_exponent: 8
exponent: 0.6
bunchlength: 1.1
# Simulation parameters
number_of_turns: 12_000
diag_setting: 1
dt_cont: 3
dt_beam: 1000
dt_cl: 1000
dt_prfl: 1000
dt_ld: 10_001
dt_int: 1
# Phase loop settings
include_global: 1
pl_gain: 0.0
kick_mode: [0, 1, 2]
kick_turn: 2_000
kick_amplitude: 20
# LHC settings
voltage: 3.5
# Impedance settings
include_impedance: 1
broadband: 1
f_cutoff: 5e9
z_over_n: 0.082
# HT condor settings
flavour: 'longlunch'         # job should be much longer
run_gpu: 1
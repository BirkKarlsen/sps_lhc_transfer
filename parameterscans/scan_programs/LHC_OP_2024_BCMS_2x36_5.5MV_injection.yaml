# Simulation of SPS-LHC injection using the operational BCMS beam from 2024
beam_name: 'LHC_OP_2024_BCMS_2x36b_mu1.5'
scheme: 'single_injection.yaml'
profile_length: 900
number_of_turns: 10000
# Diagnostics
diag_setting: 2
dt_cont: 10
dt_beam: 500
dt_cl: 500
dt_prfl: 10000
dt_ld: 500
# LLRF
loaded_q: 20000
open_otfb: 0
voltage: 5.5
pre_detune: 1
clamp: 1
clamping_thres: 276e3
# Beam
energy_error: # 16.6, -39.4
  start: -100
  stop: 100
  steps: 21
  scale: 'linear'
phase_error: # 5.6, -6.6
  start: -10
  stop: 10
  steps: 11
  scale: 'linear'
simulated_beam: 1
include_global: [0, 1]
flavour: 'workday'
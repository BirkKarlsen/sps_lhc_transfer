# Simulation of SPS-LHC injection using the MD standard beam from 2025 but with the full voltage in the SPS
beam_name: 'HL-LHC_MD_2025_1x72b_reduced_gain'
scheme: 'single_injection.yaml'
profile_length: 800
number_of_turns: 100_000
# Diagnostics
diag_setting: 2
dt_cont: 10
dt_beam: 5000
dt_cl: 5000
dt_prfl: 100000
dt_ld: 5000
# LLRF
loaded_q: 20000
open_otfb: 1
voltage: 8
pre_detune: 1
clamp: 0
clamping_thres: 350e3
# Beam
energy_error: 30.0
phase_error: 5.0
simulated_beam: 1
include_global: 1
# Impedance
include_impedance: 1
impedance_model: 'HL-LHC_450GeV.dat'
include_cc_hom: 1
flavour: 'testmatch'
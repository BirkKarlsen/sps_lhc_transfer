# Simulation of SPS-LHC injection using the MD standard beam from 2025 including the limited rf power in the SPS
beam_name: 'LHC_MD_2024_1x48b'
scheme: 'single_injection.yaml'
profile_length: 800
number_of_turns: 10000
# Diagnostics
diag_setting: 2
dt_cont: 10
dt_beam: 500
dt_cl: 500
dt_prfl: 10000
dt_ld: 500
# LLRF
loaded_q: 20000
open_otfb: 0
voltage:
  [5, 6, 7, 8, 9]
pre_detune: 1
clamp: 0
clamping_thres: 350e3
# Beam
energy_error: # 16.6, -39.4
  start: -100
  stop: 100
  steps: 11
  scale: 'linear'
phase_error: # 5.6, -6.6
  start: -15
  stop: 15
  steps: 11
  scale: 'linear'
simulated_beam: 1
include_global: 1
# Impedance
impedance_model: 'LHC_450GeV_noRF_2024_june.dat'
flavour: 'workday'